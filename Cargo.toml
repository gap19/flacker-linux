[package]
name = "flacker"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "An offline, high-resolution FLAC library player for GNOME"
license = "GPL-3.0-or-later"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_16"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_6"] }
gst = { package = "gstreamer", version = "0.24" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.37"
walkdir = "2"
sha2 = "0.10"
rand = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
